<div class="shell">
  <aside class="sidebar">
    <div>
      <div class="tracker-candidaturas">
        <img src="tracker-icon.svg" alt="" />
        Tracker de Candidaturas
      </div>
      <a class="quadro" routerLink="/quadro" routerLinkActive="active">
        <img src="quadro-icon.svg" alt="" />
        Quadro
      </a>
      <a class="estatisticas" routerLink="/estatisticas" routerLinkActive="active">
        <img src="estatisticas-icon.svg" alt="" />
        Estatísticas
      </a>
    </div>

    <div class="theme-selector">
      <button
        type="button"
        class="light"
        [class.active]="theme() === 'light'"
        [attr.aria-pressed]="theme() === 'light'"
        (click)="setTheme('light')"
      >
        <img src="light-icon.svg" alt="" />Claro
      </button>
      <button
        type="button"
        class="dark"
        [class.active]="theme() === 'dark'"
        [attr.aria-pressed]="theme() === 'dark'"
        (click)="setTheme('dark')"
      >
        <img src="dark-icon.svg" alt="" /> Escuro
      </button>
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
